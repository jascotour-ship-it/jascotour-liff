<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>佳士多旅行社｜行程介紹</title>
<style>
  :root { --accent: #0E7490; --soft: #E6F3F6; --text: #1F2937; --muted: #4B5563; --bg: #F3F4F6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { background: var(--accent); color: #fff; padding: 20px 16px 18px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; }
  .dm { display: block; width: 100%; height: auto; background: #E5E7EB; }
  .nodm { height: 120px; display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--accent); font-size: 14px; }
  .body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .name { font-size: 18px; font-weight: 700; margin: 0; }
  .price { font-size: 14px; color: var(--muted); }
  .price b { color: var(--accent); font-size: 17px; }
  .dates { display: flex; flex-wrap: wrap; gap: 6px; }
  .date { font-size: 13px; padding: 5px 9px; border-radius: 999px; background: var(--soft); color: var(--accent); }
  .date.full { background: #F3F4F6; color: #6B7280; text-decoration: line-through; }
  .btn { display: block; text-align: center; text-decoration: none; height: 48px; line-height: 48px; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }
  .center { text-align: center; color: var(--muted); padding: 40px 10px; }
</style>
</head>
<body>
<header>
  <h1>佳士多旅行社｜行程介紹</h1>
  <p>點圖片可放大看完整 DM，喜歡就直接報名</p>
</header>
<main id="list"><div class="center">載入中…</div></main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyLlUyK88umV2MGH2FlJiQkUHsUxzoWYZPGz_sk9eN-4Y6ghWs2WHrZQx8VRcrRxifV/exec';
const FORM_URL = 'https://liff.line.me/2012595109-RCwe38TM';
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const money = (n) => 'NT$ ' + Number(n).toLocaleString('en-US');
const fmtDay = (d) => { const p = d.split('/'); return `${+p[1]}/${+p[2]}（${WEEK[new Date(+p[0], p[1] - 1, +p[2]).getDay()]}）`; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

async function load() {
  const box = document.getElementById('list');
  try {
    const data = await (await fetch(API_URL)).json();
    if (!data.ok) throw new Error(data.error || '讀取失敗');
    box.innerHTML = '';
    if (!data.trips.length) { box.appendChild(el('div', 'center', '目前沒有開放報名的行程，歡迎直接在聊天室詢問。')); return; }
    data.trips.forEach((t) => {
      const card = el('section', 'card');
      if (t.dm) {
        const a = el('a'); a.href = t.dm; a.target = '_blank'; a.rel = 'noopener';
        const img = el('img', 'dm'); img.src = t.dm; img.alt = t.name + ' 行程 DM'; img.loading = 'lazy';
        img.onerror = () => { a.replaceWith(el('div', 'nodm', '行程 DM 準備中')); };
        a.appendChild(img); card.appendChild(a);
      } else {
        card.appendChild(el('div', 'nodm', '行程 DM 準備中'));
      }
      const body = el('div', 'body');
      body.appendChild(el('h2', 'name', t.name));
      const min = Math.min(...t.dates.map((d) => d.adultPrice));
      const price = el('div', 'price'); price.append('大人 '); price.appendChild(el('b', '', money(min))); price.append(' 起 / 人');
      body.appendChild(price);
      const dates = el('div', 'dates');
      t.dates.forEach((d) => dates.appendChild(el('span', 'date' + (d.left <= 0 ? ' full' : ''), fmtDay(d.date) + (d.left <= 0 ? ' 額滿' : ` 剩 ${d.left} 位`))));
      body.appendChild(dates);
      const open = t.dates.some((d) => d.left > 0);
      const btn = el('a', 'btn', open ? '立即報名' : '已額滿，私訊詢問候補');
      btn.href = open ? FORM_URL + '?trip=' + encodeURIComponent(t.name) : 'https://line.me/R/oaMessage/@558fxfxn/?' + encodeURIComponent('想詢問候補：' + t.name);
      body.appendChild(btn);
      card.appendChild(body);
      box.appendChild(card);
    });
    box.appendChild(el('p', 'hint', '有任何問題，歡迎直接在聊天室留言詢問'));
  } catch (e) {
    box.innerHTML = '';
    box.appendChild(el('div', 'center', '讀取行程失敗，請稍後再試。'));
  }
}
load();
</script>
</body>
</html>
