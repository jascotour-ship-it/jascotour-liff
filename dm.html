<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>佳士多旅行社｜行程介紹</title>
<style>
  :root { --accent: #0E7490; --soft: #E6F3F6; --text: #1F2937; --muted: #4B5563; --bg: #F3F4F6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { background: var(--accent); color: #fff; padding: 18px 16px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 19px; }
  header p { margin: 3px 0 0; font-size: 13px; opacity: .85; }
  .back { background: none; border: 0; color: #fff; font-size: 26px; line-height: 1; padding: 4px 8px 4px 0; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 110px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; cursor: pointer; }
  .dm { display: block; width: 100%; height: auto; background: #E5E7EB; }
  .nodm { height: 110px; display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--accent); font-size: 14px; }
  .body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .name { font-size: 18px; font-weight: 700; margin: 0; }
  .price { font-size: 14px; color: var(--muted); }
  .price b { color: var(--accent); font-size: 17px; }
  .dates { display: flex; flex-wrap: wrap; gap: 6px; }
  .date { font-size: 13px; padding: 5px 9px; border-radius: 999px; background: var(--soft); color: var(--accent); }
  .date.full { background: #F3F4F6; color: #6B7280; text-decoration: line-through; }
  .more { font-size: 14px; color: var(--accent); font-weight: 700; }
  .sec { background: #fff; border-radius: 14px; padding: 14px; }
  .sec h3 { margin: 0 0 8px; font-size: 15px; }
  .detail { white-space: pre-wrap; line-height: 1.8; font-size: 15px; }
  .imgs { background: #fff; border-radius: 14px; overflow: hidden; }
  .embed { display: block; width: 100%; height: 72vh; border: 0; border-radius: 10px; background: #F3F4F6; margin: 4px 0 8px; }
  .open { display: block; font-size: 14px; color: var(--accent); font-weight: 700; text-decoration: none; margin-bottom: 6px; }
  .linkbtn { display: block; text-align: center; text-decoration: none; height: 46px; line-height: 46px; border-radius: 12px;
    border: 1.5px solid var(--accent); color: var(--accent); font-size: 15px; font-weight: 700; margin: 6px 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #E5E7EB;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); }
  .bar a { display: block; max-width: 532px; margin: 0 auto; text-align: center; text-decoration: none; height: 50px; line-height: 50px;
    border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }
  .center { text-align: center; color: var(--muted); padding: 40px 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <button class="back" id="back" hidden aria-label="返回行程列表">‹</button>
  <div><h1 id="title">佳士多旅行社｜行程介紹</h1><p id="sub">點行程 DM 看完整行程內容</p></div>
</header>
<main id="list"><div class="center">載入中…</div></main>
<main id="view" hidden></main>
<div class="bar" id="bar" hidden><a id="signup" href="#">立即報名這個行程</a></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyLlUyK88umV2MGH2FlJiQkUHsUxzoWYZPGz_sk9eN-4Y6ghWs2WHrZQx8VRcrRxifV/exec';
const FORM_URL = 'https://liff.line.me/2012595109-RCwe38TM';
const OA_CHAT = 'https://line.me/R/oaMessage/@558fxfxn/?';
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const $ = (id) => document.getElementById(id);
const money = (n) => 'NT$ ' + Number(n).toLocaleString('en-US');
const fmtDay = (d) => { const p = d.split('/'); return `${+p[1]}/${+p[2]}（${WEEK[new Date(+p[0], p[1] - 1, +p[2]).getDay()]}）`; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let trips = [];

function dmImg(src, alt) {
  const img = el('img', 'dm'); img.src = src; img.alt = alt; img.loading = 'lazy';
  img.onerror = () => img.replaceWith(el('div', 'nodm', '行程 DM 準備中'));
  return img;
}
function priceLine(t) {
  const p = el('div', 'price'); p.append('大人 '); p.appendChild(el('b', '', money(Math.min(...t.dates.map((d) => d.adultPrice))))); p.append(' 起 / 人');
  return p;
}
function dateChips(t) {
  const box = el('div', 'dates');
  t.dates.forEach((d) => box.appendChild(el('span', 'date' + (d.left <= 0 ? ' full' : ''), fmtDay(d.date) + (d.left <= 0 ? ' 額滿' : ` 剩 ${d.left} 位`))));
  return box;
}
const dmsOf = (t) => (t.dms && t.dms.length ? t.dms : (t.dm ? [t.dm] : []));

function renderList() {
  const box = $('list'); box.innerHTML = '';
  if (!trips.length) { box.appendChild(el('div', 'center', '目前沒有開放報名的行程，歡迎直接在聊天室詢問。')); return; }
  trips.forEach((t, i) => {
    const card = el('section', 'card');
    const dms = dmsOf(t);
    card.appendChild(dms.length ? dmImg(dms[0], t.name + ' 行程 DM') : el('div', 'nodm', '行程 DM 準備中'));
    const body = el('div', 'body');
    body.append(el('h2', 'name', t.name), priceLine(t), dateChips(t), el('div', 'more', '看完整行程 ›'));
    card.appendChild(body);
    card.onclick = () => { location.hash = 'trip=' + encodeURIComponent(t.name); };
    box.appendChild(card);
  });
  box.appendChild(el('p', 'hint', '有任何問題，歡迎直接在聊天室留言詢問'));
}

/** J 欄可放文字或連結：雲端硬碟檔案、Google 文件直接嵌入顯示，其他網址顯示成按鈕 */
function previewUrl(u) {
  let m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{20,})/);
  if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  m = u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]{20,})/);
  if (m) return 'https://docs.google.com/' + m[1] + '/d/' + m[2] + '/preview';
  return '';
}
function renderDetail(sec, text) {
  let buf = [];
  const flush = () => { if (buf.join('').trim()) sec.appendChild(el('div', 'detail', buf.join('\n').trim())); buf = []; };
  text.split('\n').forEach((line) => {
    const u = line.trim();
    if (!/^https?:\/\/\S+$/.test(u)) { buf.push(line); return; }
    flush();
    const pv = previewUrl(u);
    if (pv) {
      const f = el('iframe', 'embed'); f.src = pv; f.allow = 'autoplay'; f.loading = 'lazy'; sec.appendChild(f);
      const o = el('a', 'open', '在新視窗開啟完整行程 ›'); o.href = u; o.target = '_blank'; o.rel = 'noopener'; sec.appendChild(o);
    } else {
      const o = el('a', 'linkbtn', '查看完整行程 ›'); o.href = u; o.target = '_blank'; o.rel = 'noopener'; sec.appendChild(o);
    }
  });
  flush();
}

function renderTrip(t) {
  const box = $('view'); box.innerHTML = '';
  const dms = dmsOf(t);
  if (dms.length) { const w = el('div', 'imgs'); dms.forEach((src, i) => w.appendChild(dmImg(src, `${t.name} 行程 DM ${i + 1}`))); box.appendChild(w); }
  const info = el('div', 'sec'); info.append(el('h2', 'name', t.name), priceLine(t)); info.lastChild.style.margin = '6px 0 10px'; info.appendChild(dateChips(t)); box.appendChild(info);
  const sec = el('div', 'sec'); sec.appendChild(el('h3', '', '行程內容'));
  renderDetail(sec, t.detail || '詳細行程內容準備中，歡迎直接在聊天室詢問。');
  box.appendChild(sec);
  const open = t.dates.some((d) => d.left > 0);
  $('signup').textContent = open ? '立即報名這個行程' : '已額滿，私訊詢問候補';
  $('signup').href = open ? FORM_URL + '?trip=' + encodeURIComponent(t.name) : OA_CHAT + encodeURIComponent('想詢問候補：' + t.name);
}

function route() {
  const m = location.hash.match(/^#trip=(.+)$/);
  const t = m && trips.find((x) => x.name === decodeURIComponent(m[1]));
  $('list').hidden = !!t; $('view').hidden = !t; $('bar').hidden = !t; $('back').hidden = !t;
  $('title').textContent = t ? t.name : '佳士多旅行社｜行程介紹';
  $('sub').textContent = t ? '完整行程內容' : '點行程 DM 看完整行程內容';
  if (t) renderTrip(t);
  window.scrollTo(0, 0);
}
$('back').onclick = () => { if (history.length > 1) history.back(); else location.hash = ''; };
window.addEventListener('hashchange', route);

(async function load() {
  try {
    const data = await (await fetch(API_URL)).json();
    if (!data.ok) throw new Error(data.error || '讀取失敗');
    trips = data.trips;
    renderList(); route();
  } catch (e) {
    $('list').innerHTML = ''; $('list').appendChild(el('div', 'center', '讀取行程失敗，請稍後再試。'));
  }
})();
</script>
</body>
</html>
